<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warehouse Smart Dashboard | Multi-User System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        .dark .glass-card { background: rgba(15, 23, 42, 0.8); }
        .sidebar-btn-active { background: #3b82f6; color: white !important; }
        .btn-primary { background-color: #3b82f6; color: white; transition: all 0.2s; }
        @media (min-width: 768px) { .main-content { margin-left: 280px; } }
        
        .scan-focus-ring { 
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .scan-focus-ring:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        
        .live-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        #scanner-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #000;
        }
        #reader { width: 100% !important; height: 100% !important; border: none !important; }
        #reader video { object-fit: cover !important; }
        
        .scan-frame-ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scan-target {
            width: 260px;
            height: 260px;
            border-radius: 32px;
            position: relative;
            box-shadow: 0 0 0 2000px rgba(0,0,0,0.6);
        }

        @media print {
            .no-print { display: none !important; }
            #invoice-print-area, #invoice-print-area *,
            #delay-report-print-area, #delay-report-print-area * { visibility: visible; }
            body * { visibility: hidden; }
            #invoice-print-area { position: absolute; left: 0; top: 0; width: 100%; border: none !important; }
            #delay-report-print-area { position: absolute; left: 0; top: 0; width: 100%; border: none !important; }
        }

        .round-am { background-color: #fef3c7; color: #92400e; }
        .round-pm { background-color: #e0f2fe; color: #075985; }
        .dark .round-am { background-color: #92400e; color: #fef3c7; }
        .dark .round-pm { background-color: #075985; color: #e0f2fe; }

        .round-btn-active { 
            background-color: #3b82f6 !important; 
            color: white !important; 
            border-color: #3b82f6 !important;
        }
    </style>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6', accent: '#10b981' } } } }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-300">

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 z-[999] flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="bg-primary p-3 rounded-2xl text-white w-16 h-16 mx-auto mb-4 flex items-center justify-center">
                    <i data-lucide="warehouse" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tighter uppercase">TGT3 <span class="text-primary">WMS</span></h1>
                <p class="text-slate-400 text-sm mt-2">Multi-User Warehouse System</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-1 block">Username</label>
                    <input type="text" id="username" required
                           class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-800 px-4 py-4 rounded-2xl font-black text-sm outline-none focus:ring-2 focus:ring-primary/20 transition-all"
                           placeholder="Enter username">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-1 block">Password</label>
                    <input type="password" id="password" required
                           class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-800 px-4 py-4 rounded-2xl font-black text-sm outline-none focus:ring-2 focus:ring-primary/20 transition-all"
                           placeholder="Enter password">
                </div>
                <button type="submit" class="w-full btn-primary py-4 rounded-2xl font-black uppercase text-sm shadow-xl hover:scale-[1.01] transition-all">
                    Sign In
                </button>
            </form>
            
            <div id="login-error" class="hidden mt-4 p-3 bg-rose-50 dark:bg-rose-500/10 text-rose-500 rounded-2xl text-xs font-black text-center"></div>
        </div>
    </div>

    <!-- Main App (Hidden until login) -->
    <div id="main-app" class="hidden">
        <!-- Include all the original HTML structure here, but modified for API calls -->
        <!-- This is a simplified version - you'll need to copy the rest from original -->
        
        <script>
            // API Configuration
            const API_BASE = window.location.origin + '/api';
            let authToken = localStorage.getItem('authToken');
            let currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
            let socket = null;

            // API Helper Functions
            async function apiCall(endpoint, options = {}) {
                const url = `${API_BASE}${endpoint}`;
                const config = {
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`,
                        ...options.headers
                    },
                    ...options
                };

                try {
                    const response = await fetch(url, config);
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'API request failed');
                    }
                    
                    return data;
                } catch (error) {
                    console.error('API Error:', error);
                    showToast(error.message || 'Connection error');
                    throw error;
                }
            }

            // Authentication
            async function login(username, password) {
                try {
                    const data = await apiCall('/auth/login', {
                        method: 'POST',
                        body: JSON.stringify({ username, password })
                    });
                    
                    authToken = data.token;
                    currentUser = data.user;
                    
                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    
                    return data;
                } catch (error) {
                    throw error;
                }
            }

            function logout() {
                authToken = null;
                currentUser = {};
                localStorage.removeItem('authToken');
                localStorage.removeItem('currentUser');
                if (socket) socket.disconnect();
                location.reload();
            }

            // Initialize Socket.IO
            function initializeSocket() {
                socket = io({
                    auth: {
                        token: authToken
                    }
                });

                socket.on('connect', () => {
                    console.log('Connected to server');
                    socket.emit('join-room', 'warehouse');
                });

                socket.on('orders-updated', (data) => {
                    console.log('Orders updated:', data);
                    updateDashboard();
                    updateDispatchList();
                });

                socket.on('dispatch-completed', (data) => {
                    console.log('Dispatch completed:', data);
                    updateDashboard();
                    renderHistory();
                    showToast(`Dispatch completed: ${data.totalQuantity} items`);
                });

                socket.on('disconnect', () => {
                    console.log('Disconnected from server');
                });
            }

            // Modified Dashboard Functions
            async function updateDashboard() {
                try {
                    const [stats, orders] = await Promise.all([
                        apiCall('/dashboard/stats'),
                        apiCall('/orders')
                    ]);

                    document.getElementById('stat-daily-target').innerText = stats.dailyTarget;
                    document.getElementById('stat-today-shipped').innerText = stats.shippedToday;
                    document.getElementById('stat-today-remaining').innerText = stats.remaining;
                    document.getElementById('stat-overdue').innerText = stats.delay;
                    document.getElementById('stat-total-load').innerText = stats.totalLoad;

                    const tbody = document.getElementById('dashboard-table-body');
                    tbody.innerHTML = orders.map(o => `
                        <tr class="hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                            <td class="px-6 py-3 font-black text-primary uppercase">${o.customer_name}</td>
                            <td class="px-6 py-3 font-bold text-slate-600 dark:text-slate-300">${o.kanban_id || '-'}</td>
                            <td class="px-6 py-3 font-bold text-slate-400 text-center">${o.order_no}</td>
                            <td class="px-6 py-3 font-medium">${o.sale_part}</td>
                            <td class="px-6 py-3 text-center">
                                <div class="text-[10px] font-bold ${o.delivery_date < new Date().toISOString().split('T')[0] ? 'text-rose-500' : 'text-slate-500'}">${o.delivery_date}</div>
                            </td>
                            <td class="px-6 py-3 text-center font-bold text-accent">${o.shipped_qty || 0}</td>
                            <td class="px-6 py-3 text-center font-black ${o.remaining_qty > 0 ? 'text-rose-500' : 'text-slate-200'}">${o.remaining_qty}</td>
                        </tr>
                    `).join('');
                } catch (error) {
                    console.error('Update dashboard error:', error);
                }
            }

            // Modified Dispatch Functions
            async function updateDispatchList() {
                try {
                    const search = document.getElementById('barcode-input').value.toUpperCase();
                    let orders = await apiCall('/orders');
                    
                    if(search) {
                        orders = orders.filter(o => 
                            o.customer_name.toUpperCase().includes(search) || 
                            o.sale_part.toUpperCase().includes(search) || 
                            o.order_no.toUpperCase().includes(search) || 
                            (o.kanban_id && o.kanban_id.toUpperCase().includes(search))
                        );
                    }
                    
                    orders = orders.filter(o => o.remaining_qty > 0);
                    
                    const container = document.getElementById('dispatch-list-container');
                    container.innerHTML = orders.length === 0 ? 
                        `<div class="col-span-full py-20 text-center opacity-20 text-xs font-bold uppercase italic">ไม่มีรายการที่รอดำเนินการ</div>` : 
                        orders.map(o => {
                            const isSelected = selectedOrderIds.has(o.id);
                            return `
                            <div onclick="toggleOrderSelection(${o.id})" class="cursor-pointer bg-white dark:bg-slate-900 p-5 rounded-3xl border ${isSelected ? 'border-primary ring-2 ring-primary/10' : 'border-slate-100 dark:border-slate-800'} transition-all group shadow-sm flex items-center gap-4 active:scale-95">
                                <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all ${isSelected ? 'bg-primary border-primary text-white' : 'border-slate-200 dark:border-slate-700'}">${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}</div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-2 mb-0.5"><span class="text-[9px] font-black text-primary uppercase tracking-tighter">${o.customer_name}</span><span class="text-[8px] font-black bg-accent/10 text-accent px-1.5 py-0.5 rounded uppercase">${o.kanban_id || '-'}</span></div>
                                    <h4 class="font-black text-sm truncate uppercase tracking-tight">${o.sale_part}</h4>
                                    <p class="text-[8px] font-bold text-slate-400 mt-0.5 uppercase">${o.order_no} | Due: ${o.delivery_date}</p>
                                </div>
                                <div class="text-right"><p class="text-[8px] font-black text-slate-300 uppercase">Stock</p><p class="font-black text-xl leading-none">${o.remaining_qty}</p></div>
                            </div>
                        `;
                        }).join('');
                    lucide.createIcons();
                } catch (error) {
                    console.error('Update dispatch list error:', error);
                }
            }

            // Modified Excel Import
            document.getElementById('excel-input').onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                toggleLoading(true, "กำลังตรวจสอบข้อมูล...");
                const reader = new FileReader();
                
                reader.onload = async (ev) => {
                    try {
                        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
                        const sheetName = wb.SheetNames.find(n => n.includes("TGT3")) || wb.SheetNames[0];
                        const sheet = wb.Sheets[sheetName];
                        const raw = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                        
                        // Parse Excel data similar to original
                        let map = { cust: -1, part: -1, kanban: -1, date: -1, qty: -1, order: -1 };
                        const head = raw.find(r => {
                            r.forEach((c, i) => {
                                const v = String(c || "").toUpperCase();
                                if(v.includes("CUSTOMER")) map.cust = i;
                                if(v.includes("SALE PART") || v.includes("PART NO")) map.part = i;
                                if(v.includes("KANBAN") || v.includes("TAG ID")) map.kanban = i;
                                if(v.includes("DATE")) map.date = i;
                                if(v.includes("QTY")) map.qty = i;
                                if(v.includes("ORDER NO1") || v.includes("ORDER REF")) map.order = i;
                            });
                            return map.cust !== -1 && map.part !== -1;
                        });

                        if(!head) throw new Error("รูปแบบไฟล์ไม่ถูกต้อง");

                        const rows = raw.slice(raw.indexOf(head) + 1).filter(r => r[map.cust]);
                        const orders = [];

                        for (const r of rows) {
                            const customerName = String(r[map.cust] || "").trim();
                            const customerCode = customerName.replace(/\s+/g, '').substring(0, 10).toUpperCase();
                            const salePart = String(r[map.part] || "").trim();
                            const kanbanId = map.kanban !== -1 ? String(r[map.kanban] || "").trim() : "";
                            const orderNo = String(r[map.order] || "-").trim();
                            const deliveryDate = r[map.date] ? (typeof r[map.date] === 'number' ? new Date((r[map.date] - 25569) * 86400 * 1000).toISOString().split('T')[0] : String(r[map.date]).split(' ')[0]) : new Date().toISOString().split('T')[0];
                            const qtyInFile = parseInt(r[map.qty]) || 0;
                            
                            if (qtyInFile > 0) {
                                orders.push({
                                    customerName,
                                    customerCode,
                                    salePart,
                                    kanbanId,
                                    orderNo,
                                    deliveryDate,
                                    qty: qtyInFile
                                });
                            }
                        }

                        const result = await apiCall('/orders/import-excel', {
                            method: 'POST',
                            body: { orders }
                        });

                        if (result.duplicateCount > 0) {
                            document.getElementById('duplicate-count-text').innerHTML = `พบข้อมูลซ้ำทั้งหมด <span class="text-amber-500 font-bold">${result.duplicateCount} รายการ</span>`;
                            document.getElementById('duplicate-alert-modal').classList.remove('hidden');
                        }

                        showToast(`นำเข้าสำเร็จ ${result.addedCount} รายการใหม่`);
                        showTab('dashboard');
                        e.target.value = '';
                    } catch (err) {
                        alert(err.message);
                    } finally {
                        toggleLoading(false);
                    }
                };
                
                reader.readAsArrayBuffer(file);
            };

            // Login Form Handler
            document.getElementById('login-form').onsubmit = async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const errorDiv = document.getElementById('login-error');
                
                try {
                    await login(username, password);
                    document.getElementById('login-modal').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    initializeSocket();
                    updateClock();
                    showTab('dashboard');
                } catch (error) {
                    errorDiv.textContent = error.message || 'Login failed';
                    errorDiv.classList.remove('hidden');
                }
            };

            // Keep all the original utility functions (showToast, toggleTheme, etc.)
            function showToast(msg) {
                const t = document.getElementById('toast');
                document.getElementById('toast-msg').innerText = msg;
                t.classList.remove('hidden');
                setTimeout(() => t.classList.add('hidden'), 2500);
            }

            function toggleLoading(s) { 
                document.getElementById('loading-overlay').classList.toggle('hidden', !s); 
            }

            function updateClock() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                ['sidebar-clock', 'dashboard-clock', 'dispatch-clock'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) el.innerText = timeStr;
                });
            }

            // Initialize
            setInterval(updateClock, 1000);
            
            // Check if already logged in
            if (authToken) {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                initializeSocket();
                updateClock();
                showTab('dashboard');
            }
        </script>
    </div>
</body>
</html>
